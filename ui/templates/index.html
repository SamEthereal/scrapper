<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportunity & Job Scraper Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Navigation Bar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-compass text-white text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-tight leading-none">Opportunity Hub</h1>
          <span class="text-xs text-slate-400">Telegram & Web Scraper Engine</span>
        </div>
      </div>

      <!-- Quick Stats -->
      <div class="hidden sm:flex items-center space-x-4">
        <div class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700/60 flex items-center space-x-2">
          <i class="fa-solid fa-graduation-cap text-indigo-400 text-sm"></i>
          <span class="text-xs text-slate-300">Scholarships:</span>
          <span id="stat-opps" class="text-xs font-bold text-white">0</span>
        </div>
        <div class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700/60 flex items-center space-x-2">
          <i class="fa-solid fa-briefcase text-emerald-400 text-sm"></i>
          <span class="text-xs text-slate-300">4-Day Jobs:</span>
          <span id="stat-jobs" class="text-xs font-bold text-white">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-6">

    <!-- Hero / Controls Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <!-- Tab Switcher -->
      <div class="flex p-1 bg-slate-800 rounded-xl border border-slate-700/80 w-fit">
        <button id="tab-opps" onclick="switchTab('opps')" class="px-5 py-2 rounded-lg text-sm font-semibold transition-all bg-brand-600 text-white shadow-md">
          <i class="fa-solid fa-graduation-cap mr-2"></i> Scholarships & Fellowships
        </button>
        <button id="tab-jobs" onclick="switchTab('jobs')" class="px-5 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-white">
          <i class="fa-solid fa-briefcase mr-2"></i> Remote 4-Day Jobs
        </button>
      </div>

      <!-- Trigger Scraper Buttons -->
      <div class="flex items-center space-x-3">
        <button id="scrape-btn" onclick="triggerScrape()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-medium text-slate-200 transition-all flex items-center space-x-2 hover:border-indigo-500">
          <i id="scrape-icon" class="fa-solid fa-rotate text-indigo-400"></i>
          <span id="scrape-text">Sync Live Data</span>
        </button>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="bg-slate-800/80 rounded-2xl border border-slate-700/80 p-4 space-y-3">
      <div class="flex flex-col sm:flex-row gap-3">
        <!-- Search Input -->
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
          <input 
            type="text" 
            id="search-input" 
            oninput="handleSearch()"
            placeholder="Search by title, country, keyword, or company..." 
            class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-brand-500 transition-colors"
          />
        </div>

        <!-- Sort Select -->
        <select id="sort-select" onchange="loadCurrentTab()" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-brand-500">
          <option value="default">Default Sort</option>
          <option value="deadline">Soonest Deadline</option>
          <option value="score">Highest Work-Life Score</option>
          <option value="title">Alphabetical (Title)</option>
        </select>
      </div>

      <!-- Quick Filter Pills -->
      <div id="filter-pills" class="flex flex-wrap gap-2 pt-1 text-xs">
        <!-- Injected via JavaScript based on active tab -->
      </div>
    </div>

    <!-- Alert / Toast Banner -->
    <div id="status-toast" class="hidden p-4 rounded-xl border text-sm transition-all"></div>

    <!-- Cards Grid -->
    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Loading Skeleton or Cards injected via JS -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16 space-y-3">
      <i class="fa-regular fa-folder-open text-4xl text-slate-600"></i>
      <p class="text-slate-400 font-medium">No results matched your search or filters.</p>
    </div>

  </main>

  <!-- JavaScript Application Logic -->
  <script>
    let currentTab = 'opps';
    let currentFilters = {};
    let searchTimeout = null;

    async function init() {
      await updateStats();
      renderFilterPills();
      loadCurrentTab();
    }

    async function updateStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('stat-opps').innerText = data.scholarships_count;
        document.getElementById('stat-jobs').innerText = data.jobs_count;
      } catch (err) {
        console.error('Failed to load stats', err);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      currentFilters = {};
      document.getElementById('search-input').value = '';

      const btnOpps = document.getElementById('tab-opps');
      const btnJobs = document.getElementById('tab-jobs');

      if (tab === 'opps') {
        btnOpps.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all bg-brand-600 text-white shadow-md";
        btnJobs.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-white";
      } else {
        btnJobs.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all bg-brand-600 text-white shadow-md";
        btnOpps.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-white";
      }

      renderFilterPills();
      loadCurrentTab();
    }

    function renderFilterPills() {
      const container = document.getElementById('filter-pills');
      container.innerHTML = '';

      if (currentTab === 'opps') {
        const pills = [
          { label: 'All', key: null },
          { label: '⏳ Closing Soon (<60d)', key: 'closing_soon' },
          { label: '🇬🇧 UK', key: 'country', val: 'UK' },
          { label: '🇪🇸 Spain', key: 'country', val: 'Spain' },
          { label: '🇺🇸 USA', key: 'country', val: 'USA' },
          { label: '🎓 PhD Only', key: 'level', val: 'PhD' },
        ];
        pills.forEach(p => {
          const isActive = (p.key === 'closing_soon' && currentFilters.closing_soon) || 
                           (p.key && currentFilters[p.key] === p.val) || 
                           (!p.key && Object.keys(currentFilters).length === 0);
          const btn = document.createElement('button');
          btn.className = `px-3 py-1.5 rounded-lg border transition-all ${
            isActive ? 'bg-indigo-600/30 border-indigo-500 text-indigo-200 font-semibold' : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-slate-200'
          }`;
          btn.innerText = p.label;
          btn.onclick = () => {
            if (!p.key) currentFilters = {};
            else if (p.key === 'closing_soon') currentFilters = { closing_soon: true };
            else currentFilters = { [p.key]: p.val };
            renderFilterPills();
            loadCurrentTab();
          };
          container.appendChild(btn);
        });
      } else {
        const pills = [
          { label: 'All Jobs', key: null },
          { label: '💰 Listed Salary Only', key: 'has_salary' },
          { label: '🌟 Work-Life 90+ Score', key: 'min_score', val: 90 },
          { label: '🌍 Remote Worldwide', key: 'search', val: 'Worldwide' },
          { label: '💻 Engineering', key: 'search', val: 'Engineer' },
          { label: '🎨 Design', key: 'search', val: 'Design' },
        ];
        pills.forEach(p => {
          const isActive = (p.key === 'has_salary' && currentFilters.has_salary) || 
                           (p.key && currentFilters[p.key] === p.val) || 
                           (!p.key && Object.keys(currentFilters).length === 0);
          const btn = document.createElement('button');
          btn.className = `px-3 py-1.5 rounded-lg border transition-all ${
            isActive ? 'bg-emerald-600/30 border-emerald-500 text-emerald-200 font-semibold' : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-slate-200'
          }`;
          btn.innerText = p.label;
          btn.onclick = () => {
            if (!p.key) currentFilters = {};
            else if (p.key === 'has_salary') currentFilters = { has_salary: true };
            else currentFilters = { [p.key]: p.val };
            renderFilterPills();
            loadCurrentTab();
          };
          container.appendChild(btn);
        });
      }
    }

    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        loadCurrentTab();
      }, 250);
    }

    async function loadCurrentTab() {
      const container = document.getElementById('cards-container');
      const emptyState = document.getElementById('empty-state');
      const searchVal = document.getElementById('search-input').value.trim();
      const sortVal = document.getElementById('sort-select').value;

      container.innerHTML = '<div class="col-span-full py-12 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p>Loading listings...</p></div>';

      try {
        if (currentTab === 'opps') {
          let url = new URL('/api/opportunities', window.location.origin);
          if (searchVal) url.searchParams.set('search', searchVal);
          if (currentFilters.country) url.searchParams.set('country', currentFilters.country);
          if (currentFilters.level) url.searchParams.set('level', currentFilters.level);
          if (currentFilters.closing_soon) url.searchParams.set('closing_soon', 'true');
          if (sortVal === 'deadline') {
            url.searchParams.set('sort_by', 'deadline');
            url.searchParams.set('order', 'asc');
          } else if (sortVal === 'title') {
            url.searchParams.set('sort_by', 'title');
            url.searchParams.set('order', 'asc');
          }

          const res = await fetch(url);
          const opps = await res.json();
          renderOpportunityCards(opps);
        } else {
          let url = new URL('/api/jobs', window.location.origin);
          if (searchVal) url.searchParams.set('search', searchVal);
          else if (currentFilters.search) url.searchParams.set('search', currentFilters.search);
          if (currentFilters.has_salary) url.searchParams.set('has_salary', 'true');
          if (currentFilters.min_score) url.searchParams.set('min_score', currentFilters.min_score);
          if (sortVal === 'score') {
            url.searchParams.set('sort_by', 'score');
            url.searchParams.set('order', 'desc');
          } else if (sortVal === 'title') {
            url.searchParams.set('sort_by', 'title');
            url.searchParams.set('order', 'asc');
          }

          const res = await fetch(url);
          const jobs = await res.json();
          renderJobCards(jobs);
        }
      } catch (err) {
        container.innerHTML = `<div class="col-span-full py-8 text-center text-rose-400">Error loading data: ${err.message}</div>`;
      }
    }

    function renderOpportunityCards(items) {
      const container = document.getElementById('cards-container');
      const emptyState = document.getElementById('empty-state');
      container.innerHTML = '';

      if (!items || items.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      items.forEach(it => {
        const card = document.createElement('div');
        card.className = "bg-slate-800/90 rounded-2xl border border-slate-700/80 p-5 flex flex-col justify-between hover:border-indigo-500/60 hover:shadow-xl transition-all duration-200 group";

        const highlights = it.key_highlights || [];
        const hlHtml = highlights.slice(0, 3).map(h => `
          <li class="flex items-start text-xs text-slate-300">
            <i class="fa-solid fa-check text-emerald-400 mt-0.5 mr-2 shrink-0"></i>
            <span>${h}</span>
          </li>
        `).join('');

        const deadlineText = it.deadline_date || it.deadline || 'Rolling / Not specified';
        const applyLink = it.official_portal || it.apply_url || '#';

        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded-md text-[11px] font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                <i class="fa-solid fa-award mr-1"></i> Scholarship
              </span>
              <span class="text-xs font-medium text-amber-300 bg-amber-400/10 px-2.5 py-1 rounded-md border border-amber-400/20">
                <i class="fa-regular fa-clock mr-1"></i> ${deadlineText}
              </span>
            </div>

            <h3 class="font-bold text-white text-base group-hover:text-indigo-300 transition-colors line-clamp-2">
              ${it.title}
            </h3>

            ${highlights.length ? `<ul class="space-y-1.5 pt-1">${hlHtml}</ul>` : ''}
          </div>

          <div class="pt-5 mt-4 border-t border-slate-700/60 flex items-center justify-between">
            <span class="text-xs text-slate-400">@${it.channel_name || 'OHUB4AllET'}</span>
            <a href="${applyLink}" target="_blank" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition-all inline-flex items-center space-x-1.5 shadow-md shadow-indigo-600/20">
              <span>Apply Portal</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderJobCards(items) {
      const container = document.getElementById('cards-container');
      const emptyState = document.getElementById('empty-state');
      container.innerHTML = '';

      if (!items || items.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      items.forEach(j => {
        const card = document.createElement('div');
        card.className = "bg-slate-800/90 rounded-2xl border border-slate-700/80 p-5 flex flex-col justify-between hover:border-emerald-500/60 hover:shadow-xl transition-all duration-200 group";

        const score = j.work_life_score;
        const scoreBadge = score ? `
          <span class="px-2.5 py-1 rounded-md text-[11px] font-bold ${
            score >= 90 ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' : 'bg-slate-700 text-slate-300'
          }">
            <i class="fa-solid fa-heart-pulse mr-1"></i> ${score}/100 Score
          </span>
        ` : '';

        const salaryBadge = j.salary ? `
          <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
            ${j.salary}
          </span>
        ` : '<span class="text-xs text-slate-400">Salary not listed</span>';

        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded-md text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <i class="fa-solid fa-calendar-check mr-1"></i> 4-Day Week
              </span>
              ${scoreBadge}
            </div>

            <div>
              <h3 class="font-bold text-white text-base group-hover:text-emerald-300 transition-colors line-clamp-2">
                ${j.title}
              </h3>
              <p class="text-xs text-slate-300 font-medium mt-1 flex items-center">
                <i class="fa-solid fa-building mr-1.5 text-slate-400"></i> ${j.company}
              </p>
            </div>

            <div class="flex items-center text-xs text-slate-400 space-x-2 pt-1">
              <i class="fa-solid fa-location-dot text-slate-400"></i>
              <span class="truncate">${j.location || 'Remote'}</span>
            </div>
          </div>

          <div class="pt-4 mt-4 border-t border-slate-700/60 flex items-center justify-between">
            ${salaryBadge}
            <a href="${j.url}" target="_blank" class="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-all inline-flex items-center space-x-1.5 shadow-md shadow-emerald-600/20">
              <span>View Job</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function triggerScrape() {
      const btn = document.getElementById('scrape-btn');
      const icon = document.getElementById('scrape-icon');
      const text = document.getElementById('scrape-text');
      const toast = document.getElementById('status-toast');

      btn.disabled = true;
      icon.classList.add('fa-spin');
      text.innerText = "Scraping...";

      const endpoint = currentTab === 'opps' ? '/api/scrape/scholarships' : '/api/scrape/jobs';

      try {
        const res = await fetch(endpoint, { method: 'POST' });
        const data = await res.json();

        toast.classList.remove('hidden');
        if (data.success) {
          toast.className = "p-4 rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 text-sm";
          toast.innerHTML = `<i class="fa-solid fa-circle-check mr-2"></i> Scraped ${data.scraped} items (${data.new_inserted} new additions). Total now: ${data.total_now}.`;
        } else {
          toast.className = "p-4 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-300 text-sm";
          toast.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> ${data.error || 'Failed to scrape'}`;
        }

        await updateStats();
        loadCurrentTab();
      } catch (err) {
        toast.classList.remove('hidden');
        toast.className = "p-4 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-300 text-sm";
        toast.innerHTML = `<i class="fa-solid fa-circle-xmark mr-2"></i> Network error: ${err.message}`;
      } finally {
        btn.disabled = false;
        icon.classList.remove('fa-spin');
        text.innerText = "Sync Live Data";
        setTimeout(() => toast.classList.add('hidden'), 5000);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
